<!-- mockup-member-profile.html -->
<div class="mockup-frame" aria-hidden="true">
  <div class="mockup-header-bar">
    <div class="mockup-dots">
      <span class="mockup-dot"></span>
      <span class="mockup-dot"></span>
      <span class="mockup-dot"></span>
    </div>
    <span class="chip chip-preview">Preview</span>
  </div>
  <div class="mockup-screen-inner" style="background: var(--surface); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border);">
    <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 16px;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #00F7FF, #00939A); color: #051417; font-weight: 800; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        DS
      </div>
      <div>
        <h4 style="margin: 0; font-size: 1.1rem; color: var(--text);">Member Profile</h4>
        <span style="font-size: 0.8125rem; color: var(--text-muted);">Founding Member · Lagos, Nigeria</span>
      </div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;">
      <span class="chip" style="font-size: 0.75rem;">Cloud Architecture</span>
      <span class="chip" style="font-size: 0.75rem;">AI Systems</span>
      <span class="chip" style="font-size: 0.75rem;">Tech Leadership</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border);">
      <span style="font-size: 0.8125rem; color: var(--text);">Open to mentoring</span>
      <span class="chip chip-status-open" style="font-size: 0.75rem;">Active</span>
    </div>
  </div>
</div>
