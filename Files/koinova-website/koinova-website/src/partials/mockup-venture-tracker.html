<!-- mockup-venture-tracker.html -->
<div class="mockup-frame" aria-hidden="true" style="border-color: rgba(13, 155, 114, 0.4);">
  <div class="mockup-header-bar">
    <div class="mockup-dots">
      <span class="mockup-dot"></span>
      <span class="mockup-dot"></span>
      <span class="mockup-dot"></span>
    </div>
    <span class="chip chip-preview" style="background: rgba(13, 155, 114, 0.15); color: var(--success-text); border-color: rgba(13, 155, 114, 0.35);">Ventures Preview</span>
  </div>
  <div class="mockup-screen-inner" style="background: var(--surface); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h4 style="margin: 0; font-size: 1rem; color: var(--text);">Venture Progress Pipeline</h4>
      <span class="chip" style="font-size: 0.75rem;">Seed Stage</span>
    </div>
    <!-- 3-Stage Pipeline Visual -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;">
      <div style="background: rgba(13, 155, 114, 0.1); border: 1px solid rgba(13, 155, 114, 0.3); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;">
        <span style="font-size: 0.7rem; color: var(--success-text); font-weight: 700;">STAGE 1</span>
        <div style="font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-top: 4px;">Concept</div>
      </div>
      <div style="background: rgba(13, 155, 114, 0.2); border: 1px solid var(--brand-emerald); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;">
        <span style="font-size: 0.7rem; color: var(--success-text); font-weight: 700;">STAGE 2</span>
        <div style="font-size: 0.8125rem; font-weight: 600; color: var(--text); margin-top: 4px;">Prototype</div>
      </div>
      <div style="background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; opacity: 0.6;">
        <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: 700;">STAGE 3</span>
        <div style="font-size: 0.8125rem; font-weight: 600; color: var(--text-muted); margin-top: 4px;">Launch</div>
      </div>
    </div>
    <div style="font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between;">
      <span>Cohort: Alpha Founders</span>
      <span>Mentorship: Active</span>
    </div>
  </div>
</div>
