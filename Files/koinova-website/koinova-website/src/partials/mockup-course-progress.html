<!-- mockup-course-progress.html -->
<div class="mockup-frame" aria-hidden="true">
  <div class="mockup-header-bar">
    <div class="mockup-dots">
      <span class="mockup-dot"></span>
      <span class="mockup-dot"></span>
      <span class="mockup-dot"></span>
    </div>
    <span class="chip chip-preview">Preview</span>
  </div>
  <div class="mockup-screen-inner" style="background: var(--surface); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border);">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
      <span class="chip chip-status-open" style="font-size: 0.75rem;">Academy Track</span>
      <span style="font-size: 0.75rem; color: var(--text-muted);">Module 3 of 6</span>
    </div>
    <h4 style="margin: 0 0 8px 0; font-size: 1.05rem; color: var(--text);">Faith, Ethics &amp; AI Engineering</h4>
    <p style="font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 16px;">
      Building trustworthy machine intelligence with biblical values and societal stewardship.
    </p>
    <div style="margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text);">
      <span>Course Progress</span>
      <span style="font-weight: 700; color: var(--link);">65%</span>
    </div>
    <div style="width: 100%; height: 8px; background: var(--surface-raised); border-radius: 9999px; overflow: hidden; border: 1px solid var(--border);">
      <div style="width: 65%; height: 100%; background: var(--grad-blue); border-radius: 9999px;"></div>
    </div>
  </div>
</div>
